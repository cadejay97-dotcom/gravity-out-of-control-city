<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>重力失控的城市</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: manipulation; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg,#120e2a 0%,#241a4e 35%,#3c2358 62%,#6e3350 82%,#c96a3c 100%);
    -webkit-touch-callout: none; user-select: none; -webkit-user-select: none;
  }
  #stage {
    position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* minimal loading screen: shown until the three.js modules finish loading */
  #loading {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #17102e;
    font-family: -apple-system, "PingFang SC", sans-serif;
    transition: opacity .6s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .title { color: #ffe9c4; font-size: 22px; letter-spacing: 10px; margin-bottom: 6px;
    text-shadow: 0 0 18px rgba(255,180,90,.45); }
  #loading .sub { color: rgba(255,255,255,.4); font-size: 11px; letter-spacing: 4px; margin-bottom: 30px; }
  #loading .barWrap { width: min(220px, 56vw); height: 3px; border-radius: 2px;
    background: rgba(255,255,255,.12); overflow: hidden; }
  #loading .bar { height: 100%; width: 40%; border-radius: 2px;
    background: linear-gradient(90deg,#ffb765,#ffe9c4);
    animation: loadslide 1.1s ease-in-out infinite alternate; }
  @keyframes loadslide { from { transform: translateX(-60%); } to { transform: translateX(320%); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="loading">
  <div class="title">重力失控的城市</div>
  <div class="sub">GRAVITY LOST CITY</div>
  <div class="barWrap"><div class="bar"></div></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
